<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Utilities</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 12px;
        min-width: 220px;
      }

      button {
        width: 100%;
        padding: 8px;
        border: 1px solid #222;
        border-radius: 4px;
